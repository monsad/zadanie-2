global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: webhook
    metrics_path: /metrics
    static_configs:
      # Host port 8000: local uvicorn, or the published app container.
      # One target, so the same process is not scraped twice.
      - targets: ["host.docker.internal:8000"]
