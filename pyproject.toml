[project]
name = "webhook-receiver"
version = "0.1.0"
description = "Webhook receiver with durable SQLite queue and idempotent processing"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.27",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 79
target-version = "py315"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "ASYNC", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
